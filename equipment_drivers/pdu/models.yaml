# Data-driven PDU model definitions.
# Each vendor section maps a registry signature to its model attributes.
# The base driver class for each vendor handles all protocol logic;
# these entries only supply the per-model identity and matching info.
#
# `model` must contain the vendor part number (the first word with a digit):
# discovery matches it against the model the device reports. `channels` is a
# fallback: drivers read the real outlet count from the device once connected.
# Only switchable PDUs belong here -- e.g. WTI's TSM console servers and PTS
# transfer switches have no per-outlet control and were removed.

